[project]
name = "ling-shu"
version = "0.1.0"
description = "Prompt hosting platform — OpenAI-compatible proxy with per-agent system prompts and structured output"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
ling-shu = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
